<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Qabulxona — CRM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f7fa;overflow-x:hidden}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.sidebar{position:fixed;top:0;left:0;width:280px;height:100vh;background:#07568A;z-index:400;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain}
.sidebar.open{transform:translateX(0)}
.sbov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:399;display:none}
.sbov.open{display:block}
.topbar{position:sticky;top:0;z-index:50;background:#07568A;color:#fff;padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(7,86,138,.3)}
.hbtn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.15);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.nl{display:flex;align-items:center;gap:12px;padding:13px 20px;color:rgba(255,255,255,.7);font-size:14px;font-weight:500;cursor:pointer;border-left:3px solid transparent;transition:all .15s}
.nl:hover,.nl.active{background:rgba(255,255,255,.12);color:#fff}
.nl.active{border-left-color:#fff}
.nic{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nl.active .nic{background:rgba(255,255,255,.22)}
.card{background:#fff;border-radius:16px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.li{display:flex;align-items:center;padding:14px 16px;background:#fff;border-bottom:1px solid #f3f4f6;cursor:pointer;transition:background .1s}
.li:first-child{border-radius:16px 16px 0 0}.li:last-child{border-bottom:none;border-radius:0 0 16px 16px}.li:only-child{border-radius:16px}.li:active{background:#f9fafb}
.lic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:12px}
.inp{width:100%;padding:12px 14px;border:1.5px solid #e5e7eb;border-radius:12px;font-size:15px;outline:none;background:#fff;transition:border-color .15s;-webkit-appearance:none}
.inp:focus{border-color:#07568A}
.ig{margin-bottom:16px}
.il{font-size:12px;font-weight:700;color:#6b7280;margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:.4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;width:100%}
.btn:active{transform:scale(.98)}
.bp{background:#07568A;color:#fff}.bs{background:#f3f4f6;color:#374151}.bd{background:#fee2e2;color:#ef4444}
.bsm{padding:8px 14px;font-size:13px;width:auto;border-radius:10px}
.tabs{display:flex;gap:4px;background:#f3f4f6;border-radius:12px;padding:4px;margin-bottom:16px}
.tab{flex:1;padding:9px;text-align:center;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:transparent;color:#6b7280;transition:all .15s}
.tab.on{background:#fff;color:#07568A;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chkr{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f3f4f6;cursor:pointer}
.chkr:last-child{border-bottom:none}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid #d1d5db;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.chk.on{background:#22c55e;border-color:#22c55e;color:#fff;font-size:13px}
.mp{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;scrollbar-width:none}
.mp::-webkit-scrollbar{display:none}
.mpb{flex-shrink:0;padding:8px 16px;border-radius:20px;border:1.5px solid #e5e7eb;font-size:13px;font-weight:500;cursor:pointer;background:#fff;color:#6b7280;white-space:nowrap}
.mpb.on{background:#07568A;color:#fff;border-color:#07568A}
.sbox{display:flex;align-items:center;gap:10px;background:#f3f4f6;border-radius:12px;padding:11px 14px;margin-bottom:16px}
.sbox input{border:none;background:transparent;outline:none;font-size:15px;flex:1}
.gpill{padding:7px 14px;border-radius:20px;border:1.5px solid #e5e7eb;font-size:13px;cursor:pointer;background:#fff;color:#6b7280;display:inline-block;margin:3px}
.gpill.on{background:#07568A;color:#fff;border-color:#07568A}
.st{font-size:11px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.pv{padding:16px;padding-bottom:32px}
.prf-hdr{background:linear-gradient(135deg,#07568A,#0a7bc4);padding:28px 20px 20px;color:#fff;text-align:center}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:11px 22px;border-radius:24px;font-size:14px;font-weight:500;z-index:9999;white-space:nowrap;display:none}
</style>
</head>
<body>
<div id="toast"></div>

<div id="loading" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f5f7fa">
  <svg style="animation:spin .7s linear infinite" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#07568A" stroke-width="2.5"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/></svg>
</div>

<div id="app" style="display:none">
  <div class="sbov" id="sbov" onclick="sbClose()"></div>
  <div class="sidebar" id="sidebar">
    <div class="prf-hdr">
      <div style="width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;border:3px solid rgba(255,255,255,.3)">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>
      </div>
      <div style="font-weight:700;font-size:17px" id="sbName">Qabulxona</div>
      <div style="font-size:13px;opacity:.75;margin-top:4px">Qabulxona xodimi</div>
    </div>
    <div style="padding:12px 0;flex:1" id="sbNav"></div>
    <div style="padding:16px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:rgba(255,255,255,.3);text-align:center">O'quv Markazi CRM v3.0</div>
  </div>

  <div class="topbar">
    <button class="hbtn" onclick="sbOpen()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <span style="font-size:17px;font-weight:600" id="pgTitle">Qabulga yozilganlar</span>
    <div style="width:36px"></div>
  </div>

  <div id="content" class="pv"></div>
</div>

<div id="modals"></div>

<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
function getTid(){
  const uid=tg?.initDataUnsafe?.user?.id;
  if(uid)return uid.toString();
  try{
    const raw=tg?.initData||'';
    if(raw){const p=new URLSearchParams(raw);const u=JSON.parse(decodeURIComponent(p.get('user')||'{}'));if(u.id)return u.id.toString();}
  }catch(e){}
  return null;
}
async function api(method,path,body){
  const tid=getTid();
  const headers={'Content-Type':'application/json'};
  if(tid)headers['x-telegram-id']=tid;
  const r=await fetch('/api'+path,{method,headers,body:body?JSON.stringify(body):undefined});
  const d=await r.json();if(!r.ok)throw new Error(d.error||'Xatolik');return d;
}
const G=p=>api('GET',p),P=(p,b)=>api('POST',p,b),U=(p,b)=>api('PUT',p,b),D=p=>api('DELETE',p);
function fmt(n){return Number(n).toLocaleString('ru-RU')+" so'm";}
function mLabel(my){if(!my)return'';const[y,m]=my.split('-');const ms=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentyabr','Oktyabr','Noyabr','Dekabr'];return ms[parseInt(m)-1]+' '+y;}
function sixMonths(){const now=new Date(),res=[];for(let i=-2;i<=3;i++){const d=new Date(now.getFullYear(),now.getMonth()+i,1);const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;if(k>='2026-04')res.push(k);}return res;}
function nowMonth(){const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;}
let _tt;function toast(msg,ms=2800){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(_tt);_tt=setTimeout(()=>t.style.display='none',ms);}
function ldHtml(){return `<div style="display:flex;justify-content:center;padding:48px"><svg style="animation:spin .7s linear infinite" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#07568A" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/></svg></div>`;}
function emHtml(msg){return `<div style="text-align:center;padding:48px 20px;color:#9ca3af"><div style="font-size:48px;margin-bottom:12px">📭</div><div style="font-size:14px">${msg}</div></div>`;}
function openModal(title,html){closeModal();const d=document.createElement('div');d.id='modal';d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:flex-end';d.innerHTML=`<div style="background:#fff;border-radius:24px 24px 0 0;width:100%;max-height:92vh;overflow-y:auto;animation:slideUp .25s ease;overscroll-behavior:contain"><div style="padding:12px 20px 16px;border-bottom:1px solid #f3f4f6;position:sticky;top:0;background:#fff;z-index:10"><div style="width:40px;height:4px;background:#e5e7eb;border-radius:2px;margin:0 auto 14px"></div><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:18px;font-weight:700">${title}</div><button onclick="closeModal()" style="background:none;border:none;font-size:24px;cursor:pointer;color:#9ca3af;padding:0">×</button></div></div><div style="padding:16px 20px 32px">${html}</div></div>`;d.addEventListener('click',e=>{if(e.target===d)closeModal();});document.getElementById('modals').appendChild(d);}
function closeModal(){const m=document.getElementById('modal');if(m)m.remove();}

function sbOpen(){document.getElementById('sidebar').classList.add('open');document.getElementById('sbov').classList.add('open');document.getElementById('content').style.overflow='hidden';}
function sbClose(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sbov').classList.remove('open');document.getElementById('content').style.overflow='';}

const REC_NAV=[
  {id:'applist',label:'Qabulga yozilganlar',svg:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>'},
  {id:'applicants',label:'Qabulga yozish',svg:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>'},
  {id:'groups',label:'Guruhlar',svg:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>'},
  {id:'payments',label:"To'lovlar",svg:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>'},
  {id:'expenses',label:'Chiqimlar',svg:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'},
  {id:'debtors',label:'Qarzdorlar',svg:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'},
  {id:'edit',label:'Tahrirlash',svg:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>'},
  {id:'conversion',label:'Konversiya',svg:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"/></svg>'},
];

const TITLES={applist:'Qabulga yozilganlar',applicants:'Qabulga yozish',groups:'Guruhlar',payments:"To'lovlar",expenses:'Chiqimlar',debtors:'Qarzdorlar',edit:'Tahrirlash',conversion:'Konversiya'};
let curPage='applist';

function setupSidebar(user){
  document.getElementById('sbName').textContent=`${user.firstName} ${user.lastName}`;
  document.getElementById('sbNav').innerHTML=REC_NAV.map(n=>`
    <div class="nl${curPage===n.id?' active':''}" id="nl_${n.id}" onclick="nav('${n.id}')">
      <div class="nic">${n.svg}</div><span>${n.label}</span>
    </div>`).join('');
}

function nav(page){
  curPage=page;
  document.getElementById('pgTitle').textContent=TITLES[page]||page;
  document.querySelectorAll('.nl').forEach(el=>el.classList.toggle('active',el.id===`nl_${page}`));
  sbClose();
  const el=document.getElementById('content');
  el.innerHTML=ldHtml();
  ({applist:rAppList,applicants:rApplicants,groups:rGroups,payments:rPayments,expenses:rExpenses,debtors:rDebtors,edit:rEdit,conversion:rConversion})[page]?.(el);
}

// ============ APPLIST ============
async function rAppList(el){
  let srch='';
  el.innerHTML=`<div class="sbox"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input placeholder="Ism yoki familya..." oninput="alSrch(this.value)"/></div><div id="alList"></div>`;
  window.alSrch=v=>{srch=v;load();};
  async function load(){
    const data=await G(`/applicants${srch?`?search=${encodeURIComponent(srch)}`:''}`);
    const list=document.getElementById('alList');
    if(!data.length){list.innerHTML=emHtml("Qabulga yozilganlar yo'q");return;}
    list.innerHTML=`<div class="card" style="padding:0;overflow:hidden">${data.map(a=>{
      const s=(a.applicantSubjects||[]).map(x=>x.subject?.name).join(', ')||'';
      const ph=a.phoneSelf||a.phoneFather||a.phoneMother||'—';
      const edu={school:'Maktab',college:'Kollej',adult:'Yuqori yosh'}[a.educationType];
      return `<div class="li" onclick='alOpen(${JSON.stringify(a).replace(/'/g,"&#39;")})'>
        <div class="lic" style="background:#dbeafe"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1d4ed8" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg></div>
        <div style="flex:1"><div style="font-size:15px;font-weight:500">${a.firstName} ${a.lastName}</div>
        <div style="font-size:12px;color:#9ca3af">${edu}${a.grade?' '+a.grade+'-sinf':''} · ${s}</div>
        <div style="font-size:12px;color:#9ca3af">${ph}</div></div>
        <div style="font-size:11px;color:#d1d5db">${new Date(a.createdAt).toLocaleDateString('uz-UZ')}</div>
      </div>`;
    }).join('')}</div>`;
  }
  window.alOpen=async a=>{
    if(typeof a==='string')a=JSON.parse(a);
    const subs=(a.applicantSubjects||[]).map(x=>x.subject?.name||'');
    const edu={school:'Maktab',college:'Kollej',adult:'Yuqori yosh'}[a.educationType];
    openModal(`${a.firstName} ${a.lastName}`,`
      <div style="margin-bottom:20px">
        <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f3f4f6"><span style="color:#6b7280;font-size:14px">O'qish joyi</span><b style="font-size:14px">${edu}${a.grade?' '+a.grade+'-sinf':''}</b></div>
        ${a.phoneSelf?`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f3f4f6"><span style="color:#6b7280;font-size:14px">O'zi</span><b>${a.phoneSelf}</b></div>`:''}
        ${a.phoneFather?`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f3f4f6"><span style="color:#6b7280;font-size:14px">Otasi</span><b>${a.phoneFather}</b></div>`:''}
        ${a.phoneMother?`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f3f4f6"><span style="color:#6b7280;font-size:14px">Onasi</span><b>${a.phoneMother}</b></div>`:''}
        <div style="display:flex;justify-content:space-between;padding:10px 0"><span style="color:#6b7280;font-size:14px">Fanlar</span><b>${subs.join(', ')||'—'}</b></div>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn bd" style="flex:1" onclick="alDel(${a.id})">O'chirish</button>
        <button class="btn bp" style="flex:2" onclick='alEnroll(${JSON.stringify(a).replace(/"/g,"&quot;")})'>Guruhga biriktirish</button>
      </div>`);
  };
  window.alDel=async id=>{try{await D(`/applicants/${id}`);closeModal();toast("O'chirildi");load();}catch(e){toast('❌ '+e.message);}};
  window.alEnroll=async a=>{
    if(typeof a==='string')a=JSON.parse(a);
    const ids=(a.applicantSubjects||[]).map(x=>x.subjectId||x.subject?.id).filter(Boolean);
    if(!ids.length)return toast('Fan biriktirilmagan');
    await enrollStep(a,0,ids,[]);
  };
  async function enrollStep(a,idx,ids,asn){
    const[gs,subs2]=await Promise.all([G(`/groups?subjectId=${ids[idx]}`),G('/subjects')]);
    const sn=subs2.find(s=>s.id===ids[idx])?.name||'';
    openModal('Guruh tanlang',`
      <div style="font-size:13px;color:#07568A;font-weight:600;margin-bottom:12px">${a.firstName} ${a.lastName} — ${sn}</div>
      <div class="card" style="padding:0;overflow:hidden">
        ${gs.length===0?`<div style="padding:20px;text-align:center;color:#9ca3af">Guruhlar yo'q</div>`:
        gs.map(g=>`<div class="li" onclick="epick(${g.id})">
          <div class="lic" style="background:#dcfce7"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15803d" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
          <div style="flex:1"><div style="font-size:15px;font-weight:500">${g.name}</div><div style="font-size:12px;color:#9ca3af">${g.teacher?.firstName||''} ${g.teacher?.lastName||''}</div></div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </div>`).join('')}
      </div>`);
    window.epick=async gid=>{
      const na=[...asn,{groupId:gid}];
      if(idx+1<ids.length)await enrollStep(a,idx+1,ids,na);
      else{try{await P(`/applicants/${a.id}/enroll`,{groupAssignments:na});closeModal();toast('✅ Biriktirildi');load();}catch(e){toast('❌ '+e.message);}}
    };
  }
  load();
}

// ============ APPLICANTS FORM ============
async function rApplicants(el){
  const subs=await G('/subjects');
  let selSubs=[],selGroups={};
  el.innerHTML=`
    <div class="ig"><label class="il">Ismi</label><input id="af_fn" class="inp"/></div>
    <div class="ig"><label class="il">Familyasi</label><input id="af_ln" class="inp"/></div>
    <div class="ig"><label class="il">O'qish joyi</label><select id="af_edu" class="inp" onchange="afEdu()"><option value="school">Maktab</option><option value="college">Kollej</option><option value="adult">Yuqori yosh</option></select></div>
    <div id="af_gd" class="ig"><label class="il">Sinfi</label><input id="af_grade" type="number" min="1" max="11" class="inp" placeholder="1-11"/></div>

      </div></div>
    <div id="af_gs" style="display:none" class="ig"><label class="il">Guruh tanlash (ixtiyoriy)</label><div id="af_gl"></div></div>
    <div style="display:flex;gap:10px;margin-top:4px">
      <button class="btn bs" style="flex:1" onclick="afSave('wait')">Kutish holatida</button>

    </div>`;
  window.afEdu=()=>{document.getElementById('af_gd').style.display=document.getElementById('af_edu').value==='school'?'block':'none';};
  window.afSub=async id=>{
    const cb=document.getElementById(`afcb_${id}`);const i=selSubs.indexOf(id);
    if(i>-1){selSubs.splice(i,1);cb.classList.remove('on');cb.textContent='';}
    else{selSubs.push(id);cb.classList.add('on');cb.textContent='✓';}
    await renderGPickers();
  };
  async function renderGPickers(){
    const gs2=document.getElementById('af_gs'),gl=document.getElementById('af_gl');
    if(!selSubs.length){gs2.style.display='none';return;}
    gs2.style.display='block';
    const subMap={};subs.forEach(s=>subMap[s.id]=s.name);
    const allG=await Promise.all(selSubs.map(sid=>G(`/groups?subjectId=${sid}`)));
    gl.innerHTML=selSubs.map((sid,i)=>`
      <div style="margin-bottom:14px">
        <div style="font-size:12px;font-weight:700;color:#07568A;margin-bottom:6px">${subMap[sid]}</div>
        <div style="display:flex;flex-wrap:wrap">
          <div class="gpill${!selGroups[sid]?' on':''}" onclick="afPick(${sid},null)">Keyinroq</div>
          ${allG[i].map(g=>`<div class="gpill${selGroups[sid]===g.id?' on':''}" onclick="afPick(${sid},${g.id})">${g.name}</div>`).join('')}
        </div>
      </div>`).join('');
    window.afPick=(sid,gid)=>{if(gid===null)delete selGroups[sid];else selGroups[sid]=gid;renderGPickers();};
  }
  window.afSave=async mode=>{
    const body={firstName:document.getElementById('af_fn').value.trim(),lastName:document.getElementById('af_ln').value.trim(),educationType:document.getElementById('af_edu').value,grade:document.getElementById('af_grade')?.value||'',phoneSelf:document.getElementById('af_ps').value.trim(),phoneFather:document.getElementById('af_pf').value.trim(),phoneMother:document.getElementById('af_pm').value.trim(),subjectIds:selSubs};
    if(!body.firstName||!body.lastName)return toast('Ism va familya kerak');
    if(!body.phoneSelf&&!body.phoneFather&&!body.phoneMother)return toast('Kamida bitta telefon kerak');
    if(!body.subjectIds.length)return toast('Kamida bitta fan tanlang');
    try{
      const app=await P('/applicants',body);
      if(mode==='enroll'){const asn=Object.entries(selGroups).filter(([,gid])=>gid).map(([,gid])=>({groupId:gid}));if(asn.length)await P(`/applicants/${app.id}/enroll`,{groupAssignments:asn});toast(asn.length?'✅ Guruhga biriktirildi':'✅ Saqlandi');}
      else toast('✅ Kutish holatida saqlandi');
      nav('applist');
    } catch(e){toast('❌ '+e.message);}
  };
}

async function rPayments(el){
  const subs=await G('/subjects');

    window.pTab=t=>{ftab=t;drawTabs();if(t==='search')paySearch();else payGroup();};
    if(ftab==='search')paySearch();else payGroup();
  }

  function paySearch(){
    const pc=document.getElementById('payC');
    pc.innerHTML=`<div class="sbox"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input id="psq" placeholder="O'quvchi ismi..." oninput="psS(this.value)"/></div><div id="psR"></div>`;
    window.psS=async v=>{
      if(v.length<2){document.getElementById('psR').innerHTML='';return;}
      const sts=await G(`/payments/search?q=${encodeURIComponent(v)}`);
      const r=document.getElementById('psR');
      if(!sts.length){r.innerHTML=emHtml('Topilmadi');return;}
      r.innerHTML=`<div class="card" style="padding:0;overflow:hidden">${sts.map(s=>`<div class="li" onclick='openPF(${JSON.stringify(s).replace(/"/g,"&quot;")})'>
        <div style="flex:1"><div style="font-size:15px;font-weight:500">${s.applicant.firstName} ${s.applicant.lastName}</div>
        <div style="font-size:12px;color:#9ca3af">${s.groupStudents.map(gs=>gs.group.subject.name).join(', ')}</div></div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
      </div>`).join('')}</div>`;
    };
    window.openPF=student=>{
      if(typeof student==='string')student=JSON.parse(student);
      const activeGS=student.groupStudents.filter(gs=>gs.status==='active');
      const months=sixMonths();let sm=nowMonth();let selGs=new Set();let pt='cash';let isPartial=false;
      function draw(){
        openModal(`${student.applicant.firstName} ${student.applicant.lastName}`,`
          <div class="st">GURUH(LAR)</div>
          <div class="card" style="padding:8px 16px;margin-bottom:16px">
            ${activeGS.map(gs=>`<div class="chkr" onclick="pfG(${gs.id})">
              <div class="chk${selGs.has(gs.id)?' on':''}" id="pfgc_${gs.id}">${selGs.has(gs.id)?'✓':''}</div>
              <span style="font-size:14px;font-weight:500">${gs.group.name} — ${gs.group.subject.name}</span>
            </div>`).join('')}
          </div>
          <div class="mp">${months.map(m=>`<div class="mpb${m===sm?' on':''}" onclick="pfm('${m}')">${mLabel(m)}</div>`).join('')}</div>
          <div class="ig"><label class="il">Summa (so'm)</label>
            <input id="pfA" type="number" class="inp" placeholder="200 000" style="font-size:20px;font-weight:700" oninput="pfFmt(this.value)"/>
            <div id="pfFD" style="text-align:center;font-size:20px;font-weight:700;color:#07568A;padding:6px 0;display:none"></div>
            ${selGs.size>1?`<div style="font-size:12px;color:#9ca3af;margin-top:4px">* ${selGs.size} ta guruh uchun teng bo'linadi</div>`:''}
          </div>
          <div style="display:flex;gap:8px;margin-bottom:12px">
            <button onclick="pfFull()" style="flex:1;padding:10px;border-radius:12px;border:1.5px solid ${!isPartial?'#07568A':'#e5e7eb'};background:${!isPartial?'#07568A':'#fff'};color:${!isPartial?'#fff':'#6b7280'};font-size:13px;font-weight:600;cursor:pointer">To'liq</button>
            <button onclick="pfPart()" style="flex:1;padding:10px;border-radius:12px;border:1.5px solid ${isPartial?'#07568A':'#e5e7eb'};background:${isPartial?'#07568A':'#fff'};color:${isPartial?'#fff':'#6b7280'};font-size:13px;font-weight:600;cursor:pointer">Qisman</button>
          </div>
          ${isPartial?`<div class="ig"><label class="il">To'liq narx (so'm)</label><input id="pfTgt" type="number" class="inp" placeholder="300 000"/></div>`:''}
          <div class="tabs"><button class="tab${pt==='cash'?' on':''}" onclick="pfPT('cash')">Naqd</button><button class="tab${pt==='card'?' on':''}" onclick="pfPT('card')">Karta</button></div>
          <button class="btn bp" onclick="pfSave(${student.id})">✓ To'lovni saqlash</button>`);
        window.pfG=id=>{if(selGs.has(id))selGs.delete(id);else selGs.add(id);draw();};
        window.pfm=m=>{sm=m;draw();};
        window.pfFmt=v=>{const e=document.getElementById('pfFD');if(v){e.style.display='block';e.textContent=fmt(v);}else e.style.display='none';};
        window.pfFull=()=>{isPartial=false;draw();};window.pfPart=()=>{isPartial=true;draw();};window.pfPT=t=>{pt=t;draw();};
        window.pfSave=async sid=>{
          const a=document.getElementById('pfA').value;if(!a)return toast('Summani kiriting');if(!selGs.size)return toast('Guruh tanlang');
          const tgt=isPartial?document.getElementById('pfTgt')?.value:null;
          try{
            if(selGs.size>1)await P('/payments/batch',{studentId:sid,groupIds:Array.from(selGs),monthYear:sm,totalAmount:parseInt(a),targetAmount:tgt?parseInt(tgt):null,isPartial,paymentType:pt});
            else await P('/payments',{studentId:sid,groupId:Array.from(selGs)[0],monthYear:sm,amount:parseInt(a),targetAmount:tgt?parseInt(tgt):null,isPartial,paymentType:pt});
            closeModal();toast('✅ To\'lov saqlandi');
          } catch(e){toast('❌ '+e.message);}
        };
      }
      draw();
    };
  }

  async function payGroup(){
    const pc=document.getElementById('payC');
    let sid=null,gid=null;
    function s1(){pc.innerHTML=`<div class="st">FAN TANLANG</div><div class="card" style="padding:0;overflow:hidden">${subs.map(s=>`<div class="li" onclick="ps1(${s.id})"><div style="flex:1;font-weight:500">${s.name}</div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></div>`).join('')}</div>`;
      window.ps1=async s=>{sid=s;const gs=await G(`/groups?subjectId=${s}`);s2(gs);};
    }
    function s2(gs){pc.innerHTML=`<button class="btn bs" style="width:auto;margin-bottom:12px" onclick="s2b()">← Orqaga</button><div class="card" style="padding:0;overflow:hidden">${gs.map(g=>`<div class="li" onclick="ps2(${g.id})"><div style="flex:1"><div style="font-weight:500">${g.name}</div><div style="font-size:12px;color:#9ca3af">${g.teacher?.firstName||''} ${g.teacher?.lastName||''}</div></div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></div>`).join('')}</div>`;
      window.s2b=s1;window.ps2=async g=>{gid=g;const sts=await G(`/groups/${g}/students`);s3(sts);};
    }
    function s3(sts){let sr='';
      function d(){const f=sr?sts.filter(s=>`${s.firstName} ${s.lastName}`.toLowerCase().includes(sr.toLowerCase())):sts;
        pc.innerHTML=`<button class="btn bs" style="width:auto;margin-bottom:12px" onclick="s3b()">← Orqaga</button><div class="sbox"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input placeholder="Qidirish..." oninput="ps3s(this.value)"/></div><div class="card" style="padding:0;overflow:hidden">${f.map(s=>`<div class="li" onclick="ps3(${s.id})"><div style="flex:1;font-weight:500">${s.firstName} ${s.lastName}</div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></div>`).join('')}</div>`;
        window.ps3s=v=>{sr=v;d();};window.s3b=async()=>{const gs=await G(`/groups?subjectId=${sid}`);s2(gs);};window.ps3=stid=>s4(stid);
      }d();}
    function s4(stid){const months=sixMonths();let sm=nowMonth();let pt='cash';let isPartial=false;
      function d(){pc.innerHTML=`<button class="btn bs" style="width:auto;margin-bottom:12px" onclick="s4b()">← Orqaga</button>
        <div class="mp">${months.map(m=>`<div class="mpb${m===sm?' on':''}" onclick="s4m('${m}')">${mLabel(m)}</div>`).join('')}</div>
        <div class="ig"><label class="il">Summa (so'm)</label><input id="s4a" type="number" class="inp" style="font-size:20px;font-weight:700" placeholder="200 000" oninput="s4f(this.value)"/><div id="s4fd" style="text-align:center;font-size:20px;font-weight:700;color:#07568A;padding:6px 0;display:none"></div></div>
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <button onclick="s4full()" style="flex:1;padding:10px;border-radius:12px;border:1.5px solid ${!isPartial?'#07568A':'#e5e7eb'};background:${!isPartial?'#07568A':'#fff'};color:${!isPartial?'#fff':'#6b7280'};font-size:13px;font-weight:600;cursor:pointer">To'liq</button>
          <button onclick="s4part()" style="flex:1;padding:10px;border-radius:12px;border:1.5px solid ${isPartial?'#07568A':'#e5e7eb'};background:${isPartial?'#07568A':'#fff'};color:${isPartial?'#fff':'#6b7280'};font-size:13px;font-weight:600;cursor:pointer">Qisman</button>
        </div>
        ${isPartial?`<div class="ig"><label class="il">To'liq narx</label><input id="s4tgt" type="number" class="inp" placeholder="300 000"/></div>`:''}
        <div class="tabs"><button class="tab${pt==='cash'?' on':''}" onclick="s4pt('cash')">Naqd</button><button class="tab${pt==='card'?' on':''}" onclick="s4pt('card')">Karta</button></div>
        <button class="btn bp" onclick="s4save()">✓ To'lovni saqlash</button>`;
        window.s4m=m=>{sm=m;d();};window.s4f=v=>{const e=document.getElementById('s4fd');if(v){e.style.display='block';e.textContent=fmt(v);}else e.style.display='none';};
        window.s4full=()=>{isPartial=false;d();};window.s4part=()=>{isPartial=true;d();};window.s4pt=t=>{pt=t;d();};
        window.s4b=async()=>{const sts=await G(`/groups/${gid}/students`);s3(sts);};
        window.s4save=async()=>{const a=document.getElementById('s4a').value;if(!a)return toast('Summani kiriting');
          const tgt=isPartial?document.getElementById('s4tgt')?.value:null;
          try{await P('/payments',{studentId:stid,groupId:gid,monthYear:sm,amount:parseInt(a),targetAmount:tgt?parseInt(tgt):null,isPartial,paymentType:pt});toast('✅ Saqlandi');drawTabs();}catch(e){toast('❌ '+e.message);}
        };
      }d();}
    s1();
  }
  drawTabs();
}

              <div style="font-size:12px;color:#9ca3af">${s.phoneSelf||s.phoneFather||'—'}</div>
            </div>
            <div style="text-align:right">
              <div style="color:#ef4444;font-weight:700;font-size:14px">${fmt(s.paidAmount)}</div>
              ${s.remainingAmount?`<div style="font-size:11px;color:#9ca3af">Qoldi: ${fmt(s.remainingAmount)}</div>`:''}
            </div>
          </div>`).join('')}
        </div>
      </div>`).join('');
    };
  }
  draw();
}

// ============ EDIT ============
async function rEdit(el){
  const gs=await G('/groups');
  el.innerHTML=`
    <div class="tabs"><button class="tab on" id="et1" onclick="eTab('students')">O'quvchilar</button><button class="tab" id="et2" onclick="eTab('groups')">Guruhlar</button></div>
    <div id="editC"></div>`;
  window.eTab=t=>{document.getElementById('et1').className='tab'+(t==='students'?' on':'');document.getElementById('et2').className='tab'+(t==='groups'?' on':'');if(t==='students')editStudents();else editGroups();};
  editStudents();

  function editStudents(){
    const ec=document.getElementById('editC');
    ec.innerHTML=`<div class="st">GURUH TANLANG</div><div class="card" style="padding:0;overflow:hidden">${gs.map(g=>`<div class="li" onclick="eOpenG(${g.id})"><div style="flex:1"><div style="font-weight:500">${g.name}</div><div style="font-size:12px;color:#9ca3af">${g.subject?.name}</div></div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></div>`).join('')}</div>`;
    window.eOpenG=async gid=>{
      const sts=await G(`/groups/${gid}/students`);
      ec.innerHTML=`<button class="btn bs" style="width:auto;margin-bottom:12px" onclick="editStudents()">← Orqaga</button>
        <div class="card" style="padding:0;overflow:hidden">
          ${sts.length===0?`<div style="padding:20px;text-align:center;color:#9ca3af">O'quvchilar yo'q</div>`:
          sts.map(s=>`<div class="li" onclick='eOpenSt(${JSON.stringify(s).replace(/"/g,"&quot;")},${gid})'>
            <div style="flex:1"><div style="font-weight:500">${s.firstName} ${s.lastName}</div><div style="font-size:12px;color:#9ca3af">${s.phoneSelf||s.phoneFather||'—'}</div></div>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#07568A" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </div>`).join('')}
        </div>`;
      window.eOpenSt=async(s,gid2)=>{
        if(typeof s==='string')s=JSON.parse(s);
        const allGs=await G('/groups');
        const allSubs=await G('/subjects');
        openModal(`${s.firstName} ${s.lastName}`,`
          <div class="ig"><label class="il">Ismi</label><input id="es_fn" class="inp" value="${s.firstName}"/></div>
          <div class="ig"><label class="il">Familyasi</label><input id="es_ln" class="inp" value="${s.lastName}"/></div>
          <div class="ig"><label class="il">O'zi</label><input id="es_ps" class="inp" value="${s.phoneSelf||''}"/></div>
          <div class="ig"><label class="il">Otasi</label><input id="es_pf" class="inp" value="${s.phoneFather||''}"/></div>
          <div class="ig"><label class="il">Onasi</label><input id="es_pm" class="inp" value="${s.phoneMother||''}"/></div>
          <button class="btn bp" style="margin-bottom:12px" onclick="esSave(${s.id},${gid2})">✓ Saqlash</button>
          <div class="ig"><label class="il">Yangi guruhga qo'shish (uzmasdan)</label>
            <select id="es_addg" class="inp"><option value="">Guruh tanlang</option>${allGs.filter(g=>g.id!==gid2).map(g=>`<option value="${g.id}">${g.name} — ${g.subject?.name}</option>`).join('')}</select>
          </div>
          <button class="btn bs" style="margin-bottom:12px" onclick="esAddG(${s.id})">+ Guruhga qo'shish</button>
          <div style="display:flex;gap:8px">
            <button class="btn bs" style="flex:1;font-size:13px" onclick="esDetach(${s.id},${gid2})">Guruhdan uzish</button>
            <button class="btn bs" style="flex:1;font-size:13px" onclick='esMove(${s.id},${gid2},${JSON.stringify(allGs).replace(/"/g,"&quot;")})'>Guruh almashtirish</button>
          </div>`);
        window.esSave=async(id,g)=>{
          try{await U(`/students/${id}`,{firstName:document.getElementById('es_fn').value,lastName:document.getElementById('es_ln').value,phoneSelf:document.getElementById('es_ps').value,phoneFather:document.getElementById('es_pf').value,phoneMother:document.getElementById('es_pm').value});closeModal();toast('✅ Saqlandi');eOpenG(g);}
          catch(e){toast('❌ '+e.message);}
        };
        window.esAddG=async id=>{
          const newGid=document.getElementById('es_addg').value;if(!newGid)return toast('Guruh tanlang');
          try{await P(`/students/${id}/groups`,{groupId:newGid});closeModal();toast('✅ Qo\'shildi');eOpenG(gid2);}catch(e){toast('❌ '+e.message);}
        };
        window.esDetach=async(sid,g)=>{try{await D(`/students/${sid}/groups/${g}`);closeModal();toast('Guruhdan uzildi');eOpenG(g);}catch(e){toast('❌ '+e.message);}};
        window.esMove=(sid,g,allG2)=>{
          if(typeof allG2==='string')allG2=JSON.parse(allG2);
          openModal("Boshqa guruhga ko'chirish",`<div class="card" style="padding:0;overflow:hidden">${allG2.filter(x=>x.id!==g).map(x=>`<div class="li" onclick="doMove(${sid},${g},${x.id})"><div style="flex:1"><div style="font-weight:500">${x.name}</div><div style="font-size:12px;color:#9ca3af">${x.subject?.name}</div></div></div>`).join('')}</div>`);
          window.doMove=async(s,og,ng)=>{try{await U(`/students/${s}/groups/${og}/move`,{newGroupId:ng});closeModal();toast('✅ Ko\'chirildi');eOpenG(og);}catch(e){toast('❌ '+e.message);}};
        };
      };
    };
  }

  function editGroups(){
    const ec=document.getElementById('editC');
    ec.innerHTML=`<div class="card" style="padding:0;overflow:hidden">${gs.map(g=>`<div class="li" onclick="eOpenGH(${g.id})"><div class="lic" style="background:#dcfce7"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15803d" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></div><div style="flex:1"><div style="font-weight:500">${g.name}</div><div style="font-size:12px;color:#9ca3af">${g.subject?.name} · ${g.teacher?.firstName||''} ${g.teacher?.lastName||''}</div></div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></div>`).join('')}</div>`;
    window.eOpenGH=async gid=>{
      const[hist,teachers]=await Promise.all([G(`/groups/${gid}/teacher-history`),G('/staff/teachers')]);
      const g=gs.find(x=>x.id===gid);
      openModal(g?.name||'Guruh',`
        <div class="st">O'QITUVCHINI ALMASHTIRISH</div>
        <div class="ig"><select id="eg_t" class="inp"><option value="">O'qituvchi tanlang</option>${teachers.map(t=>`<option value="${t.id}">${t.firstName} ${t.lastName} — ${t.subject}</option>`).join('')}</select></div>
        <button class="btn bp" style="margin-bottom:20px" onclick="egSave(${gid})">✓ Almashtirish</button>
        <div class="st">O'QITUVCHILAR TARIXI</div>
        ${hist.length===0?`<div style="color:#9ca3af;font-size:14px;text-align:center;padding:12px">Tarix yo'q</div>`:
        hist.map(h=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f3f4f6">
          <div><div style="font-weight:500;font-size:14px">${h.teacher.firstName} ${h.teacher.lastName}</div><div style="font-size:12px;color:#9ca3af">${h.teacher.subject||''}</div></div>
          <div style="text-align:right;font-size:12px;color:#9ca3af">
            <div>${new Date(h.startDate).toLocaleDateString('uz-UZ')}</div>
            <div>${h.endDate?new Date(h.endDate).toLocaleDateString('uz-UZ'):'Hozir'}</div>
          </div>
        </div>`).join('')}`);
      window.egSave=async gid2=>{
        const tid=document.getElementById('eg_t').value;if(!tid)return toast('O\'qituvchi tanlang');
        try{await U(`/groups/${gid2}`,{teacherId:tid});closeModal();toast('✅ Almashtirildi');editGroups();}catch(e){toast('❌ '+e.message);}
      };
    };
  }
}

// ============ CONVERSION ============
async function rConversion(el){
  let type='cash_to_card',from='',to='';
  function draw(){
    const isCTC=type==='cash_to_card';
    el.innerHTML=`
      <div class="tabs"><button class="tab${isCTC?' on':''}" onclick="cvt('cash_to_card')">Naqd → Karta</button><button class="tab${!isCTC?' on':''}" onclick="cvt('card_to_cash')">Karta → Naqd</button></div>
      <div class="card" style="padding:16px;margin-bottom:12px;background:#f9fafb;border:1.5px solid #e5e7eb">
        <div style="font-size:12px;font-weight:700;color:#6b7280;margin-bottom:8px">${isCTC?'Naqd berildi':'Kartadan olindi'}</div>
        <input id="cv_f" type="number" class="inp" style="font-size:24px;font-weight:700;border:none;padding:0;background:transparent" placeholder="500 000" value="${from}" oninput="cvfm('from',this.value)"/>
        <div id="cv_ff" style="font-size:14px;color:#6b7280;margin-top:4px;${from?'':'display:none'}">${from?fmt(from):''}</div>
      </div>
      <div style="text-align:center;font-size:28px;color:#d1d5db;margin-bottom:12px">⬇</div>
      <div class="card" style="padding:16px;margin-bottom:20px;background:#eff6ff;border:1.5px solid #07568A">
        <div style="font-size:12px;font-weight:700;color:#07568A;margin-bottom:8px">${isCTC?'Karta qabul':'Naqd olindi'}</div>
        <input id="cv_t" type="number" class="inp" style="font-size:24px;font-weight:700;border:none;padding:0;background:transparent;color:#07568A" placeholder="505 000" value="${to}" oninput="cvfm('to',this.value)"/>
        <div id="cv_tf" style="font-size:14px;color:#07568A;margin-top:4px;${to?'':'display:none'}">${to?fmt(to):''}</div>
      </div>
      <button class="btn bp" onclick="cvSave()">✓ Saqlash</button>`;
    window.cvt=t=>{type=t;draw();};
    window.cvfm=(side,v)=>{if(side==='from')from=v;else to=v;const e=document.getElementById(`cv_${side==='from'?'ff':'tf'}`);if(v){e.style.display='block';e.textContent=fmt(v);}else e.style.display='none';};
    window.cvSave=async()=>{const f=document.getElementById('cv_f').value,t=document.getElementById('cv_t').value;if(!f||!t)return toast('Ikkala summani kiriting');
      try{await P('/conversions',{type,fromAmount:parseInt(f),toAmount:parseInt(t)});toast('✅ Saqlandi');from='';to='';draw();}catch(e){toast('❌ '+e.message);}};
  }
  draw();
}

// INIT
async function init(){
  try{
    const user=await G('/auth/me');
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='block';
    setupSidebar(user);
    nav('applist');
  } catch(e){
    document.getElementById('loading').innerHTML=`<div style="text-align:center;padding:40px"><div style="font-size:64px;margin-bottom:16px">⛔</div><div style="font-weight:600;color:#374151">Tizimga kirishda xatolik</div></div>`;
  }
}
init();
</script>
