<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Admin — CRM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f7fa;margin:0;overflow-x:hidden}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.sidebar{position:fixed;top:0;left:0;width:280px;height:100vh;background:#07568A;z-index:400;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain}
.sidebar.open{transform:translateX(0)}
.sb-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:399;display:none}
.sb-ov.open{display:block}
.topbar{position:sticky;top:0;z-index:50;background:#07568A;color:#fff;padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(7,86,138,.3)}
.hbtn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.15);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.nl{display:flex;align-items:center;gap:12px;padding:13px 20px;color:rgba(255,255,255,.7);font-size:14px;font-weight:500;cursor:pointer;border-left:3px solid transparent;transition:all .15s}
.nl:hover,.nl.active{background:rgba(255,255,255,.12);color:#fff}
.nl.active{border-left-color:#fff}
.nic{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nl.active .nic{background:rgba(255,255,255,.22)}
.card{background:#fff;border-radius:16px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.li{display:flex;align-items:center;padding:14px 16px;background:#fff;border-bottom:1px solid #f3f4f6;cursor:pointer;transition:background .1s}
.li:first-child{border-radius:16px 16px 0 0}.li:last-child{border-bottom:none;border-radius:0 0 16px 16px}.li:only-child{border-radius:16px}.li:active{background:#f9fafb}
.lic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:12px}
.inp{width:100%;padding:12px 14px;border:1.5px solid #e5e7eb;border-radius:12px;font-size:15px;outline:none;background:#fff;transition:border-color .15s;-webkit-appearance:none}
.inp:focus{border-color:#07568A}
.ig{margin-bottom:16px}
.il{font-size:12px;font-weight:700;color:#6b7280;margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:.4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;width:100%}
.btn:active{transform:scale(.98)}
.bp{background:#07568A;color:#fff}.bs{background:#f3f4f6;color:#374151}.bd{background:#fee2e2;color:#ef4444}
.bsm{padding:8px 14px;font-size:13px;width:auto;border-radius:10px}
.tabs{display:flex;gap:4px;background:#f3f4f6;border-radius:12px;padding:4px;margin-bottom:16px}
.tab{flex:1;padding:9px;text-align:center;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:transparent;color:#6b7280;transition:all .15s}
.tab.on{background:#fff;color:#07568A;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chkr{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f3f4f6;cursor:pointer}
.chkr:last-child{border-bottom:none}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid #d1d5db;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.chk.on{background:#22c55e;border-color:#22c55e;color:#fff;font-size:13px}
.mp{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;scrollbar-width:none}
.mp::-webkit-scrollbar{display:none}
.mpb{flex-shrink:0;padding:8px 16px;border-radius:20px;border:1.5px solid #e5e7eb;font-size:13px;font-weight:500;cursor:pointer;background:#fff;color:#6b7280;white-space:nowrap}
.mpb.on{background:#07568A;color:#fff;border-color:#07568A}
.sbox{display:flex;align-items:center;gap:10px;background:#f3f4f6;border-radius:12px;padding:11px 14px;margin-bottom:16px}
.sbox input{border:none;background:transparent;outline:none;font-size:15px;flex:1}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:11px 22px;border-radius:24px;font-size:14px;font-weight:500;z-index:9999;white-space:nowrap;display:none;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.cald{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:14px;cursor:pointer}
.cald.sel{background:#07568A;color:#fff;font-weight:600}
.cald.td{font-weight:700;color:#07568A}
.cald.past{color:#d1d5db;pointer-events:none}
.st{font-size:11px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.pv{padding:16px;padding-bottom:32px}
</style>
</head>
<body>
<div id="toast"></div>

<div id="loading" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f5f7fa">
  <div style="text-align:center">
    <svg style="animation:spin .7s linear infinite" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#07568A" stroke-width="2.5"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/></svg>
    <p style="color:#9ca3af;margin-top:12px;font-size:14px">Yuklanmoqda...</p>
  </div>
</div>

<div id="app" style="display:none">
  <div class="sb-ov" id="sbov" onclick="sbClose()"></div>
  <div class="sidebar" id="sidebar">
    <div style="background:linear-gradient(135deg,#07568A,#0a7bc4);padding:28px 20px 20px;color:#fff;text-align:center">
      <div style="width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;border:3px solid rgba(255,255,255,.3)">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>
      </div>
      <div style="font-weight:700;font-size:17px" id="sbName">Admin</div>
      <div style="font-size:13px;opacity:.75;margin-top:4px">Administrator</div>
    </div>
    <div style="padding:12px 0;flex:1" id="sbNav"></div>
    <div style="padding:16px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:rgba(255,255,255,.3);text-align:center">O'quv Markazi CRM v3.0</div>
  </div>

  <div class="topbar">
    <button class="hbtn" onclick="sbOpen()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <span style="font-size:17px;font-weight:600" id="pgTitle">Statistika</span>
    <div style="width:36px"></div>
  </div>

  <div id="content" class="pv"></div>
</div>

<div id="modals"></div>

<script>
// ============ CORE ============
const tg = window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}

function getTid(){
  const uid = tg?.initDataUnsafe?.user?.id;
  if(uid) return uid.toString();
  try{
    const raw = tg?.initData || '';
    if(raw){
      const p = new URLSearchParams(raw);
      const u = JSON.parse(decodeURIComponent(p.get('user') || '{}'));
      if(u.id) return u.id.toString();
    }
  }catch(e){}
  return null;
}

async function api(method, path, body){
  const tid = getTid();
  const headers = {'Content-Type':'application/json'};
  if(tid) headers['x-telegram-id'] = tid;
  const r = await fetch('/api'+path, {method, headers, body: body ? JSON.stringify(body) : undefined});
  const d = await r.json();
  if(!r.ok) throw new Error(d.error || 'Xatolik');
  return d;
}
const G = p => api('GET', p);
const P = (p, b) => api('POST', p, b);
const U = (p, b) => api('PUT', p, b);
const D = p => api('DELETE', p);

function fmt(n){ return Number(n).toLocaleString('ru-RU') + " so'm"; }
function mLabel(my){ if(!my)return''; const[y,m]=my.split('-'); const ms=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentyabr','Oktyabr','Noyabr','Dekabr']; return ms[parseInt(m)-1]+' '+y; }
function sixMonths(){ const now=new Date(),res=[]; for(let i=-2;i<=3;i++){ const d=new Date(now.getFullYear(),now.getMonth()+i,1); const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; if(k>='2026-04')res.push(k); } return res; }
function nowMonth(){ const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`; }

let _tt;
function toast(msg, ms=2800){ const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(_tt); _tt=setTimeout(()=>t.style.display='none', ms); }
function ldHtml(){ return `<div style="display:flex;justify-content:center;padding:48px"><svg style="animation:spin .7s linear infinite" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#07568A" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/></svg></div>`; }
function emHtml(msg){ return `<div style="text-align:center;padding:48px 20px;color:#9ca3af"><div style="font-size:48px;margin-bottom:12px">📭</div><div style="font-size:14px">${msg}</div></div>`; }

function openModal(title, html){
  closeModal();
  const d = document.createElement('div');
  d.id = 'modal';
  d.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:flex-end';
  d.innerHTML = `<div style="background:#fff;border-radius:24px 24px 0 0;width:100%;max-height:92vh;overflow-y:auto;animation:slideUp .25s ease;overscroll-behavior:contain">
    <div style="padding:12px 20px 16px;border-bottom:1px solid #f3f4f6;position:sticky;top:0;background:#fff;z-index:10">
      <div style="width:40px;height:4px;background:#e5e7eb;border-radius:2px;margin:0 auto 14px"></div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-size:18px;font-weight:700">${title}</div>
        <button onclick="closeModal()" style="background:none;border:none;font-size:24px;cursor:pointer;color:#9ca3af;padding:0">×</button>
      </div>
    </div>
    <div style="padding:16px 20px 32px">${html}</div>
  </div>`;
  d.addEventListener('click', e => { if(e.target===d) closeModal(); });
  document.getElementById('modals').appendChild(d);
}
function closeModal(){ const m=document.getElementById('modal'); if(m) m.remove(); }

// ============ SIDEBAR ============
function sbOpen(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('sbov').classList.add('open'); document.body.style.overflow='hidden'; }
function sbClose(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('sbov').classList.remove('open'); document.body.style.overflow=''; }

const ADMIN_NAV=[
  {id:'stats',label:'Statistika',svg:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>'},
  {id:'students',label:"O'quvchilar",svg:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>'},
  {id:'staff',label:'Hodimlar',svg:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'},
  {id:'schedule',label:'Dars jadvali',svg:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>'},
  {id:'finance',label:'Kirim-Chiqim',svg:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>'},
  {id:'debtors',label:'Qarzdorlar',svg:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'},
  {id:'settings',label:'Sozlamalar',svg:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93A10 10 0 0 0 12 2a10 10 0 0 0-7.07 2.93M4.93 4.93A10 10 0 0 0 2 12a10 10 0 0 0 2.93 7.07M19.07 19.07A10 10 0 0 0 22 12a10 10 0 0 0-2.93-7.07M12 22a10 10 0 0 0 7.07-2.93"/></svg>'},
  {id:'delstaff',label:"O'chirish",svg:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>'},
];
const TITLES={stats:'Statistika',students:"O'quvchilar",staff:'Hodimlar',schedule:'Dars jadvali',finance:'Kirim-Chiqim',debtors:'Qarzdorlar',settings:'Sozlamalar',delstaff:"O'chirish"};
let curPage='stats';

function setupSidebar(user){
  document.getElementById('sbName').textContent=`${user.firstName||''} ${user.lastName||''}`;
  document.getElementById('sbNav').innerHTML=ADMIN_NAV.map(n=>`
    <div class="nl${curPage===n.id?' active':''}" id="nl_${n.id}" onclick="nav('${n.id}')">
      <div class="nic">${n.svg}</div><span>${n.label}</span>
    </div>`).join('');
}

function nav(page){
  curPage=page;
  document.getElementById('pgTitle').textContent=TITLES[page]||page;
  document.querySelectorAll('.nl').forEach(el=>el.classList.toggle('active',el.id===`nl_${page}`));
  sbClose();
  const el=document.getElementById('content');
  el.innerHTML=ldHtml();
  ({stats:rStats,students:rStudents,staff:rStaff,schedule:rSchedule,finance:rFinance,debtors:rDebtors,settings:rSettings,delstaff:rDelStaff})[page]?.(el);
}

// ============ INIT ============
async function init(){
  try{
    const user=await G('/auth/me');
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='block';
    setupSidebar(user);
    nav('stats');
  }catch(e){
    document.getElementById('loading').innerHTML=`<div style="text-align:center;padding:40px"><div style="font-size:64px;margin-bottom:16px">⛔</div><div style="font-size:16px;font-weight:600;color:#374151">Tizimga kirishda xatolik</div><div style="font-size:14px;color:#9ca3af;margin-top:8px">Botdan /start bosing</div></div>`;
  }
}

// ============ STATS ============
async function rStats(el){
  const months=sixMonths(); let sel=nowMonth();
  async function load(){
    el.innerHTML=ldHtml();
    try{ const d=await G(`/statistics?monthYear=${sel}`); draw(d); }
    catch{ el.innerHTML=emHtml('Xatolik'); }
  }
  function mpHtml(){ return `<div class="mp">${months.map(m=>`<div class="mpb${m===sel?' on':''}" onclick="smsel('${m}')">${mLabel(m)}</div>`).join('')}</div>`; }
  function draw(d){
    if(d.noData){ el.innerHTML=mpHtml()+`<div style="text-align:center;padding:48px 20px;color:#9ca3af"><div style="font-size:48px;margin-bottom:12px">📊</div><div>Bu oydagi ma'lumotlar mavjud emas</div></div>`; window.smsel=m=>{sel=m;load();}; return; }
    const inc=d.income, exp=d.expense;
    const profit=BigInt(inc.total)-BigInt(exp.total);
    el.innerHTML=`
    ${mpHtml()}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
      <div class="card" style="padding:16px;text-align:center;cursor:pointer" onclick="nav('students')">
        <div style="width:48px;height:48px;border-radius:14px;background:#dbeafe;display:flex;align-items:center;justify-content:center;margin:0 auto 8px">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1d4ed8" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        </div>
        <div style="font-size:28px;font-weight:700;color:#1d4ed8">${d.totalStudents}</div>
        <div style="font-size:11px;color:#6b7280;margin-top:4px">O'quvchilar</div>
      </div>
      <div class="card" style="padding:16px;text-align:center">
        <div style="width:48px;height:48px;border-radius:14px;background:#dcfce7;display:flex;align-items:center;justify-content:center;margin:0 auto 8px">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#15803d" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </div>
        <div style="font-size:28px;font-weight:700;color:#15803d">${d.groupsCount}</div>
        <div style="font-size:11px;color:#6b7280;margin-top:4px">Guruhlar</div>
      </div>
      <div class="card" style="padding:16px;text-align:center">
        <div style="font-size:28px;font-weight:700;color:#854d0e">${d.oneSubject}</div>
        <div style="font-size:11px;color:#6b7280;margin-top:4px">1 ta fanda</div>
      </div>
      <div class="card" style="padding:16px;text-align:center">
        <div style="font-size:28px;font-weight:700;color:#7e22ce">${d.twoPlus}</div>
        <div style="font-size:11px;color:#6b7280;margin-top:4px">2+ fanda</div>
      </div>
    </div>
    <div class="st">MOLIYA — ${mLabel(sel)}</div>
    <div style="background:#eff6ff;border:1.5px solid #bfdbfe;border-radius:16px;padding:16px;margin-bottom:10px">
      <div style="font-size:11px;font-weight:700;color:#1d4ed8;margin-bottom:6px">KIRIM</div>
      <div style="font-size:26px;font-weight:700;color:#1d4ed8">${fmt(inc.total)}</div>
      <div style="display:flex;gap:16px;margin-top:8px;font-size:12px;color:#3b82f6"><span>Naqd: ${fmt(inc.cash)}</span><span>Karta: ${fmt(inc.card)}</span></div>
    </div>
    <div style="background:#fef2f2;border:1.5px solid #fecaca;border-radius:16px;padding:16px;margin-bottom:10px;cursor:pointer" onclick="showExpensesDetail()">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div style="font-size:11px;font-weight:700;color:#dc2626">CHIQIM</div>
        <div style="font-size:11px;color:#ef4444;font-weight:600">Batafsil →</div>
      </div>
      <div style="font-size:26px;font-weight:700;color:#dc2626">${fmt(exp.total)}</div>
      <div style="display:flex;gap:16px;margin-top:8px;font-size:12px;color:#ef4444"><span>Naqd: ${fmt(exp.cash)}</span><span>Karta: ${fmt(exp.card)}</span></div>
    </div>
    <div style="background:${profit>=0?'#f0fdf4':'#fef2f2'};border:1.5px solid ${profit>=0?'#bbf7d0':'#fecaca'};border-radius:16px;padding:16px;margin-bottom:16px">
      <div style="font-size:11px;font-weight:700;color:${profit>=0?'#15803d':'#dc2626'};margin-bottom:6px">FOYDA</div>
      <div style="font-size:26px;font-weight:700;color:${profit>=0?'#15803d':'#dc2626'}">${profit>=0?'+':''}${fmt(profit)}</div>
    </div>
    <div class="card" style="padding:16px;margin-bottom:12px">
      <div class="st" style="margin-bottom:12px">JORIY BALANS</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center">
        <div><div style="font-size:11px;color:#9ca3af;margin-bottom:4px">Naqd</div><div style="font-weight:700;color:#15803d;font-size:14px">${fmt(d.balance.cash)}</div></div>
        <div><div style="font-size:11px;color:#9ca3af;margin-bottom:4px">Karta</div><div style="font-weight:700;color:#07568A;font-size:14px">${fmt(d.balance.card)}</div></div>
        <div><div style="font-size:11px;color:#9ca3af;margin-bottom:4px">Jami</div><div style="font-weight:700;color:#1f2937;font-size:14px">${fmt(d.balance.total)}</div></div>
      </div>
    </div>

          html+=`<div style="background:#fafafa;border-radius:12px;padding:12px 14px;margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-size:14px;font-weight:600">${v.name}</span><span style="font-size:14px;font-weight:700;color:#ef4444">${fmt(total)}</span></div>${v.items.map(eItem).join('')}</div>`;
        }
        html+=`</div>`;

      if(Object.keys(byCommunal).length){
        html+=`<div style="margin-bottom:20px"><div style="font-size:13px;font-weight:700;color:#1f2937;margin-bottom:10px;display:flex;align-items:center;gap:8px"><div style="width:28px;height:28px;border-radius:8px;background:#fef9c3;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#854d0e" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>KOMUNAL</div>`;
        for(const[k,items] of Object.entries(byCommunal)){

          html+=`<div style="background:#fafafa;border-radius:12px;padding:12px 14px;margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-size:14px;font-weight:600">${k}</span><span style="font-size:14px;font-weight:700;color:#ef4444">${fmt(total)}</span></div>${items.map(eItem).join('')}</div>`;
        }
        html+=`</div>`;
      }
      if(otherList.length){
        const total=otherList.reduce((s,e)=>s+BigInt(e.amount),BigInt(0));
        html+=`<div style="margin-bottom:20px"><div style="font-size:13px;font-weight:700;color:#1f2937;margin-bottom:10px;display:flex;align-items:center;gap:8px"><div style="width:28px;height:28px;border-radius:8px;background:#f3f4f6;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></div>BOSHQA CHIQIMLAR</div><div style="background:#fafafa;border-radius:12px;padding:12px 14px"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-size:14px;font-weight:600">Jami</span><span style="font-size:14px;font-weight:700;color:#ef4444">${fmt(total)}</span></div>${otherList.map(eItem).join('')}</div></div>`;

async function rSchedule(el){
  async function loadToday(){
    el.innerHTML=ldHtml();

    const todaySection=today.length===0?
      `<div style="background:#f9fafb;border-radius:16px;padding:20px;text-align:center;color:#9ca3af;margin-bottom:16px">Bugun dars yo'q</div>`:

        <div class="li" style="cursor:default">
          <div class="lic" style="background:#dbeafe"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1d4ed8" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
          <div style="flex:1"><div style="font-size:15px;font-weight:500">${s.group.name}</div>
          <div style="font-size:12px;color:#9ca3af">${s.group.subject.name} · ${s.group.teacher?.firstName||''} ${s.group.teacher?.lastName||''}</div></div>
          <div style="font-size:13px;font-weight:600;color:#07568A">${s.startTime}–${s.endTime}</div>
        </div>`).join('')}</div>`;
    el.innerHTML=`<div class="st">BUGUNGI DARSLAR</div>${todaySection}
      <div style="display:flex;gap:10px;margin-bottom:20px">
        <button class="btn bs" style="flex:1" onclick="showWeek()">Haftalik jadval</button>
        <button class="btn bp" style="flex:1" onclick="showAddSchedule()">+ Jadval qo'shish</button>
      </div>`;
    window.showWeek=async()=>{
      el.innerHTML=ldHtml(); const week=await G('/schedule/week');
      el.innerHTML=`<button class="btn bs" style="width:auto;margin-bottom:16px" onclick="rSchedule(document.getElementById('content'))">← Orqaga</button>
        <div class="st">HAFTALIK JADVAL</div>
        ${week.map(day=>`<div style="margin-bottom:12px">
          <div style="font-size:13px;font-weight:700;color:${day.schedules.length?'#07568A':'#9ca3af'};margin-bottom:6px">${day.day} — ${new Date(day.date).toLocaleDateString('uz-UZ')}</div>
          ${day.schedules.length===0?`<div style="font-size:13px;color:#d1d5db;padding:4px 0">Dars yo'q</div>`:
          `<div class="card" style="padding:0;overflow:hidden">${day.schedules.map(s=>`
            <div class="li" style="cursor:default"><div style="flex:1"><div style="font-size:14px;font-weight:500">${s.group.name} — ${s.group.subject.name}</div></div>
            <div style="font-size:13px;font-weight:600;color:#07568A">${s.startTime}–${s.endTime}</div></div>`).join('')}</div>`}
        </div>`).join('')}`;
    };
    window.showAddSchedule=async()=>{
      const subs2=await G('/subjects');
      el.innerHTML=`<button class="btn bs" style="width:auto;margin-bottom:16px" onclick="rSchedule(document.getElementById('content'))">← Orqaga</button>
        <div class="ig"><label class="il">Fan</label><select id="schSub" class="inp" onchange="schLoadG()"><option value="">Fan tanlang</option>${subs2.map(s=>`<option value="${s.id}" data-name="${s.name}">${s.name}</option>`).join('')}</select></div>
        <div id="schGSec" style="display:none" class="ig"><label class="il">Guruh</label><select id="schG" class="inp" onchange="schLoadCal()"><option value="">Guruh tanlang</option></select></div>
        <div id="schCalSec"></div>`;
      window.schLoadG=async()=>{
        const sid=document.getElementById('schSub').value; if(!sid)return;
        const gs=await G(`/groups?subjectId=${sid}`);
        document.getElementById('schG').innerHTML=`<option value="">Guruh tanlang</option>`+gs.map(g=>`<option value="${g.id}">${g.name} — ${g.teacher?.firstName||''} ${g.teacher?.lastName||''}</option>`).join('');
        document.getElementById('schGSec').style.display='block';
        document.getElementById('schCalSec').innerHTML='';
      };
      window.schLoadCal=async()=>{
        const gid=document.getElementById('schG').value; if(!gid)return;
        const now=new Date(), month=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
        const ex=await G(`/schedule/group/${gid}?month=${month}`);
        let selDates=ex.map(s=>s.lessonDate.slice(0,10));
        const calEl=document.getElementById('schCalSec');
        const today=now.toISOString().slice(0,10);
        const y=now.getFullYear(), m=now.getMonth();
        const dim=new Date(y,m+1,0).getDate(), fd=new Date(y,m,1).getDay();
        const adj=fd===0?6:fd-1;
        const days2=['Du','Se','Ch','Pa','Ju','Sh','Ya'];
        const mns=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentyabr','Oktyabr','Noyabr','Dekabr'];
        const cells=[]; for(let i=0;i<adj;i++) cells.push('<div></div>');
        for(let d=1;d<=dim;d++){
          const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          const isPast=ds<today||ds<'2026-04-01'; const isSel=selDates.includes(ds); const isTd=ds===today;
          cells.push(`<div class="cald${isSel?' sel':''}${isTd&&!isSel?' td':''}${isPast?' past':''}" onclick="schTog(this,'${ds}')">${d}</div>`);
        }
        calEl.innerHTML=`<div class="card" style="padding:16px;margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <span style="font-weight:600">${mns[m]} ${y}</span><span id="schCnt" style="font-size:13px;color:#07568A;font-weight:600">${selDates.length} ta tanlandi</span>
          </div>
          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px">${days2.map(d=>`<div style="text-align:center;font-size:11px;font-weight:700;color:#9ca3af">${d}</div>`).join('')}</div>
          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${cells.join('')}</div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
          <div class="ig" style="margin:0"><label class="il">Boshlanish</label><input type="time" id="schSt" class="inp" value="09:00"/></div>
          <div class="ig" style="margin:0"><label class="il">Tugash</label><input type="time" id="schEn" class="inp" value="11:00"/></div>
        </div>
        <button class="btn bp" onclick="saveSch('${gid}')">✓ Jadvalni saqlash</button>`;
        window.schTog=(el2,date)=>{ const i=selDates.indexOf(date); if(i>-1){selDates.splice(i,1);el2.classList.remove('sel');}else{selDates.push(date);el2.classList.add('sel');} document.getElementById('schCnt').textContent=`${selDates.length} ta tanlandi`; };
        window.saveSch=async gid2=>{ if(!selDates.length)return toast('Kamida 1 kun tanlang');
          try{ await P(`/schedule/group/${gid2}`,{dates:selDates,startTime:document.getElementById('schSt').value,endTime:document.getElementById('schEn').value}); toast('✅ Jadval saqlandi'); }
          catch(e){ toast('❌ '+e.message); } };
      };
    };
  }
  loadToday();
}

// ============ FINANCE ============
async function rFinance(el){
  let ftab='payments';
  function drawTabs(){
    el.innerHTML=`<div class="tabs">
      <button class="tab${ftab==='payments'?' on':''}" onclick="fTab('payments')">To'lovlar</button>
      <button class="tab${ftab==='expenses'?' on':''}" onclick="fTab('expenses')">Chiqimlar</button>
      <button class="tab${ftab==='conversion'?' on':''}" onclick="fTab('conversion')">Konversiya</button>
    </div><div id="ftabContent"></div>`;
    window.fTab=t=>{ftab=t;drawTabs();if(t==='payments')rPay();else if(t==='expenses')rExp();else rConv();};
    if(ftab==='payments')rPay();else if(ftab==='expenses')rExp();else rConv();
  }
  async function rPay(){
    const fc=document.getElementById('ftabContent');
    fc.innerHTML=`<div class="tabs"><button class="tab on" id="pt1" onclick="payMode('search')">Qidiruv orqali</button><button class="tab" id="pt2" onclick="payMode('group')">Guruh orqali</button></div><div id="payContent"></div>`;
    window.payMode=mode=>{ document.getElementById('pt1').className='tab'+(mode==='search'?' on':''); document.getElementById('pt2').className='tab'+(mode==='group'?' on':''); if(mode==='search')paySearch();else payGroup(); };
    paySearch();
  }
  function paySearch(){
    const pc=document.getElementById('payContent');
    pc.innerHTML=`<div class="sbox"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input id="psq" placeholder="O'quvchi ismi..." oninput="psSearch(this.value)"/></div><div id="psRes"></div>`;
    window.psSearch=async v=>{
      if(v.length<2){document.getElementById('psRes').innerHTML='';return;}
      const students=await G(`/payments/search?q=${encodeURIComponent(v)}`);
      const res=document.getElementById('psRes');
      if(!students.length){res.innerHTML=emHtml('Topilmadi');return;}
      res.innerHTML=`<div class="card" style="padding:0;overflow:hidden">${students.map(s=>`
        <div class="li" onclick="openPayForm(${JSON.stringify(s).replace(/"/g,"&quot;")})">
          <div style="flex:1"><div style="font-size:15px;font-weight:500">${s.applicant.firstName} ${s.applicant.lastName}</div>
          <div style="font-size:12px;color:#9ca3af">${s.groupStudents.map(gs=>gs.group.subject.name).join(', ')}</div></div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </div>`).join('')}</div>`;
    };
    window.openPayForm=student=>{
      if(typeof student==='string')student=JSON.parse(student);
      const activeGS=student.groupStudents.filter(gs=>gs.status==='active');
      const months=sixMonths();let sm=nowMonth();let selGs=new Set();let pt='cash';let isPartial=false;
      function draw(){
        openModal(`${student.applicant.firstName} ${student.applicant.lastName}`,`
          <div class="st">GURUH(LAR)</div>
          <div class="card" style="padding:8px 16px;margin-bottom:16px">
            ${activeGS.map(gs=>`<div class="chkr" onclick="pgTog(${gs.id})">
              <div class="chk${selGs.has(gs.id)?' on':''}" id="pgc_${gs.id}">${selGs.has(gs.id)?'✓':''}</div>
              <span style="font-size:14px;font-weight:500">${gs.group.name} — ${gs.group.subject.name}</span>
            </div>`).join('')}
          </div>
          <div class="mp">${months.map(m=>`<div class="mpb${m===sm?' on':''}" onclick="pmSel('${m}')">${mLabel(m)}</div>`).join('')}</div>
          <div class="ig"><label class="il">Summa (so'm)</label>
            <input id="pmAmt" type="number" class="inp" placeholder="200 000" style="font-size:20px;font-weight:700" oninput="pmFmt(this.value)"/>
            <div id="pmFD" style="text-align:center;font-size:20px;font-weight:700;color:#07568A;padding:6px 0;display:none"></div>
            ${selGs.size>1?`<div style="font-size:12px;color:#9ca3af;margin-top:4px">* ${selGs.size} ta guruh uchun teng bo'linadi</div>`:''}
          </div>
          <div style="display:flex;gap:8px;margin-bottom:12px">
            <button onclick="pisFull()" style="flex:1;padding:10px;border-radius:12px;border:1.5px solid ${!isPartial?'#07568A':'#e5e7eb'};background:${!isPartial?'#07568A':'#fff'};color:${!isPartial?'#fff':'#6b7280'};font-size:13px;font-weight:600;cursor:pointer">To'liq</button>
            <button onclick="pisPartial()" style="flex:1;padding:10px;border-radius:12px;border:1.5px solid ${isPartial?'#07568A':'#e5e7eb'};background:${isPartial?'#07568A':'#fff'};color:${isPartial?'#fff':'#6b7280'};font-size:13px;font-weight:600;cursor:pointer">Qisman</button>
          </div>
          ${isPartial?`<div class="ig"><label class="il">To'liq narx (so'm)</label><input id="pmTarget" type="number" class="inp" placeholder="300 000"/></div>`:''}
          <div class="tabs"><button class="tab${pt==='cash'?' on':''}" onclick="pmPT('cash')">Naqd</button><button class="tab${pt==='card'?' on':''}" onclick="pmPT('card')">Karta</button></div>
          <button class="btn bp" onclick="savePay(${student.id})">✓ To'lovni saqlash</button>`);
        window.pgTog=id=>{if(selGs.has(id))selGs.delete(id);else selGs.add(id);draw();};
        window.pmSel=m=>{sm=m;draw();};
        window.pmFmt=v=>{const e=document.getElementById('pmFD');if(v){e.style.display='block';e.textContent=fmt(v);}else e.style.display='none';};
        window.pisFull=()=>{isPartial=false;draw();};window.pisPartial=()=>{isPartial=true;draw();};window.pmPT=t=>{pt=t;draw();};
        window.savePay=async sid=>{
          const amt=document.getElementById('pmAmt').value;if(!amt)return toast('Summani kiriting');if(!selGs.size)return toast('Guruh tanlang');
          const target=isPartial?document.getElementById('pmTarget')?.value:null;
          try{
            if(selGs.size>1) await P('/payments/batch',{studentId:sid,groupIds:Array.from(selGs),monthYear:sm,totalAmount:parseInt(amt),targetAmount:target?parseInt(target):null,isPartial,paymentType:pt});
            else await P('/payments',{studentId:sid,groupId:Array.from(selGs)[0],monthYear:sm,amount:parseInt(amt),targetAmount:target?parseInt(target):null,isPartial,paymentType:pt});
            closeModal();toast("✅ To'lov saqlandi");
          }catch(e){toast('❌ '+e.message);}
        };
      }draw();
    };
  }
  async function payGroup(){
    const pc=document.getElementById('payContent');const subs=await G('/subjects');let sid=null,gid=null;
    function step1(){pc.innerHTML=`<div class="st">FAN TANLANG</div><div class="card" style="padding:0;overflow:hidden">${subs.map(s=>`<div class="li" onclick="pgS1(${s.id})"><div style="flex:1;font-weight:500">${s.name}</div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></div>`).join('')}</div>`;
      window.pgS1=async s=>{sid=s;const gs=await G(`/groups?subjectId=${s}`);step2(gs);};}
    function step2(gs){pc.innerHTML=`<button class="btn bs" style="width:auto;margin-bottom:12px" onclick="pgBack1()">← Orqaga</button><div class="card" style="padding:0;overflow:hidden">${gs.map(g=>`<div class="li" onclick="pgS2(${g.id})"><div style="flex:1"><div style="font-weight:500">${g.name}</div><div style="font-size:12px;color:#9ca3af">${g.teacher?.firstName||''} ${g.teacher?.lastName||''}</div></div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></div>`).join('')}</div>`;
      window.pgBack1=step1;window.pgS2=async g=>{gid=g;const sts=await G(`/groups/${g}/students`);step3(sts);};}
    function step3(sts){let srch='';
      function draw2(){const f=srch?sts.filter(s=>`${s.firstName} ${s.lastName}`.toLowerCase().includes(srch.toLowerCase())):sts;
        pc.innerHTML=`<button class="btn bs" style="width:auto;margin-bottom:12px" onclick="pgBack2()">← Orqaga</button><div class="sbox"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input placeholder="Qidirish..." oninput="pgSrch(this.value)"/></div><div class="card" style="padding:0;overflow:hidden">${f.map(s=>`<div class="li" onclick="pgS3(${s.id})"><div style="flex:1;font-weight:500">${s.firstName} ${s.lastName}</div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></div>`).join('')}</div>`;
        window.pgSrch=v=>{srch=v;draw2();};window.pgBack2=async()=>{const gs=await G(`/groups?subjectId=${sid}`);step2(gs);};window.pgS3=stid=>step4(stid);}draw2();}
    function step4(stid){const months=sixMonths();let sm=nowMonth();let pt='cash';let isPartial=false;
      function draw3(){pc.innerHTML=`<button class="btn bs" style="width:auto;margin-bottom:12px" onclick="pgBack3()">← Orqaga</button>
          <div class="mp">${months.map(m=>`<div class="mpb${m===sm?' on':''}" onclick="pp4m('${m}')">${mLabel(m)}</div>`).join('')}</div>
          <div class="ig"><label class="il">Summa (so'm)</label><input id="pp4a" type="number" class="inp" placeholder="200 000" style="font-size:20px;font-weight:700" oninput="pp4f(this.value)"/><div id="pp4fd" style="text-align:center;font-size:20px;font-weight:700;color:#07568A;padding:6px 0;display:none"></div></div>
          <div style="display:flex;gap:8px;margin-bottom:12px">
            <button onclick="pp4full()" style="flex:1;padding:10px;border-radius:12px;border:1.5px solid ${!isPartial?'#07568A':'#e5e7eb'};background:${!isPartial?'#07568A':'#fff'};color:${!isPartial?'#fff':'#6b7280'};font-size:13px;font-weight:600;cursor:pointer">To'liq</button>
            <button onclick="pp4partial()" style="flex:1;padding:10px;border-radius:12px;border:1.5px solid ${isPartial?'#07568A':'#e5e7eb'};background:${isPartial?'#07568A':'#fff'};color:${isPartial?'#fff':'#6b7280'};font-size:13px;font-weight:600;cursor:pointer">Qisman</button>
          </div>
          ${isPartial?`<div class="ig"><label class="il">To'liq narx</label><input id="pp4tgt" type="number" class="inp" placeholder="300 000"/></div>`:''}
          <div class="tabs"><button class="tab${pt==='cash'?' on':''}" onclick="pp4pt('cash')">Naqd</button><button class="tab${pt==='card'?' on':''}" onclick="pp4pt('card')">Karta</button></div>
          <button class="btn bp" onclick="pp4save()">✓ To'lovni saqlash</button>`;
        window.pp4m=m=>{sm=m;draw3();};window.pp4f=v=>{const e=document.getElementById('pp4fd');if(v){e.style.display='block';e.textContent=fmt(v);}else e.style.display='none';};
        window.pp4full=()=>{isPartial=false;draw3();};window.pp4partial=()=>{isPartial=true;draw3();};window.pp4pt=t=>{pt=t;draw3();};
        window.pgBack3=async()=>{const sts=await G(`/groups/${gid}/students`);step3(sts);};
        window.pp4save=async()=>{const a=document.getElementById('pp4a').value;if(!a)return toast('Summani kiriting');
          const tgt=isPartial?document.getElementById('pp4tgt')?.value:null;
          try{await P('/payments',{studentId:stid,groupId:gid,monthYear:sm,amount:parseInt(a),targetAmount:tgt?parseInt(tgt):null,isPartial,paymentType:pt});toast('✅ Saqlandi');rPay();}catch(e){toast('❌ '+e.message);}};
      }draw3();}
    step1();
  }
  async function rExp(){
    const fc=document.getElementById('ftabContent');const staff=await G('/staff');
    let cat='staff',comm='Soliq',pt='cash';const months=sixMonths();let sm=nowMonth();
    function draw(){
      fc.innerHTML=`<div class="tabs">
        <button class="tab${cat==='staff'?' on':''}" onclick="ec('staff')">Hodim</button>
        <button class="tab${cat==='communal'?' on':''}" onclick="ec('communal')">Komunal</button>
        <button class="tab${cat==='other'?' on':''}" onclick="ec('other')">Boshqa</button>
      </div>
      ${cat==='staff'?`<div class="ig"><label class="il">Hodim</label><select id="ex_st" class="inp"><option value="">Tanlang</option>${staff.map(s=>`<option value="${s.id}">${s.firstName} ${s.lastName}</option>`).join('')}</select></div><div class="st">OY</div><div class="mp">${months.map(m=>`<div class="mpb${m===sm?' on':''}" onclick="em('${m}')">${mLabel(m)}</div>`).join('')}</div>`:''}
      ${cat==='communal'?`<div style="display:flex;gap:8px;margin-bottom:16px">${['Soliq','Elektr','Suv'].map(t=>`<button onclick="eco('${t}')" style="flex:1;padding:10px;border-radius:12px;border:1.5px solid ${comm===t?'#07568A':'#e5e7eb'};background:${comm===t?'#07568A':'#fff'};color:${comm===t?'#fff':'#6b7280'};font-size:13px;font-weight:600;cursor:pointer">${t}</button>`).join('')}</div><div class="st">OY</div><div class="mp">${months.map(m=>`<div class="mpb${m===sm?' on':''}" onclick="em('${m}')">${mLabel(m)}</div>`).join('')}</div>`:''}
      <div class="ig"><label class="il">Summa (so'm)</label><input id="ex_a" type="number" class="inp" style="font-size:20px;font-weight:700" placeholder="500 000" oninput="exf(this.value)"/><div id="ex_fd" style="text-align:center;font-size:20px;font-weight:700;color:#07568A;padding:6px 0;display:none"></div></div>
      <div class="tabs"><button class="tab${pt==='cash'?' on':''}" onclick="et('cash')">Naqd</button><button class="tab${pt==='card'?' on':''}" onclick="et('card')">Karta</button></div>
      <div class="ig"><label class="il">Izoh</label><input id="ex_n" class="inp" placeholder="Izoh..."/></div>
      <button class="btn bp" onclick="exSave()">✓ Saqlash</button>`;
      window.ec=c=>{cat=c;draw();};window.em=m=>{sm=m;draw();};window.eco=t=>{comm=t;draw();};window.et=t=>{pt=t;draw();};
      window.exf=v=>{const e=document.getElementById('ex_fd');if(v){e.style.display='block';e.textContent=fmt(v);}else e.style.display='none';};
      window.exSave=async()=>{
        const a=document.getElementById('ex_a').value;if(!a)return toast('Summani kiriting');
        const st=document.getElementById('ex_st')?.value||null;if(cat==='staff'&&!st)return toast('Hodimni tanlang');
        try{await P('/expenses',{category:cat,subcategory:cat==='communal'?comm:null,staffId:st,monthYear:cat!=='other'?sm:null,amount:parseInt(a),paymentType:pt,note:document.getElementById('ex_n').value});toast('✅ Saqlandi');draw();document.getElementById('ex_a').value='';document.getElementById('ex_fd').style.display='none';}
        catch(e){toast('❌ '+e.message);}
      };
    }draw();
  }
  async function rConv(){
    const fc=document.getElementById('ftabContent');let type='cash_to_card',from='',to='';
    function draw(){const isCTC=type==='cash_to_card';
      fc.innerHTML=`<div class="tabs"><button class="tab${isCTC?' on':''}" onclick="cvt('cash_to_card')">Naqd → Karta</button><button class="tab${!isCTC?' on':''}" onclick="cvt('card_to_cash')">Karta → Naqd</button></div>
        <div class="card" style="padding:16px;margin-bottom:12px;background:#f9fafb;border:1.5px solid #e5e7eb">
          <div style="font-size:12px;font-weight:700;color:#6b7280;margin-bottom:8px">${isCTC?'Naqd berildi':'Kartadan olindi'}</div>
          <input id="cv_f" type="number" class="inp" style="font-size:24px;font-weight:700;border:none;padding:0;background:transparent" placeholder="500 000" value="${from}" oninput="cvfm('from',this.value)"/>
          <div id="cv_ff" style="font-size:14px;color:#6b7280;margin-top:4px;${from?'':'display:none'}">${from?fmt(from):''}</div>
        </div>
        <div style="text-align:center;font-size:28px;color:#d1d5db;margin-bottom:12px">⬇</div>
        <div class="card" style="padding:16px;margin-bottom:20px;background:#eff6ff;border:1.5px solid #07568A">
          <div style="font-size:12px;font-weight:700;color:#07568A;margin-bottom:8px">${isCTC?'Karta qabul':'Naqd olindi'}</div>
          <input id="cv_t" type="number" class="inp" style="font-size:24px;font-weight:700;border:none;padding:0;background:transparent;color:#07568A" placeholder="505 000" value="${to}" oninput="cvfm('to',this.value)"/>
          <div id="cv_tf" style="font-size:14px;color:#07568A;margin-top:4px;${to?'':'display:none'}">${to?fmt(to):''}</div>
        </div>
        <button class="btn bp" onclick="cvSave()">✓ Saqlash</button>`;
      window.cvt=t=>{type=t;draw();};
      window.cvfm=(side,v)=>{if(side==='from')from=v;else to=v;const e=document.getElementById(`cv_${side==='from'?'ff':'tf'}`);if(v){e.style.display='block';e.textContent=fmt(v);}else e.style.display='none';};
      window.cvSave=async()=>{const f=document.getElementById('cv_f').value,t=document.getElementById('cv_t').value;if(!f||!t)return toast('Ikkala summani kiriting');
        try{await P('/conversions',{type,fromAmount:parseInt(f),toAmount:parseInt(t)});toast('✅ Saqlandi');from='';to='';draw();}catch(e){toast('❌ '+e.message);}};
    }draw();
  }
  drawTabs();
}

// ============ SETTINGS ============
async function rSettings(el){
  async function load(){
    const[settings,subs]=await Promise.all([G('/settings'),G('/subjects')]);
    el.innerHTML=`<div style="font-size:16px;font-weight:700;margin-bottom:16px">Kanal sozlamalari</div>
      <div class="ig"><label class="il">Hisobot kanali ID</label><input id="set_report" class="inp" placeholder="-1001234567890" value="${settings.report_channel_id||''}"/></div>
      <div class="ig"><label class="il">Davomat kanali ID</label><input id="set_att" class="inp" placeholder="-1001234567891" value="${settings.attendance_channel_id||''}"/></div>
      <div class="ig"><label class="il">Qabul kanali ID</label><input id="set_app" class="inp" placeholder="-1001234567892" value="${settings.applicant_channel_id||''}"/></div>
      <button class="btn bp" style="margin-bottom:24px" onclick="saveSettings()">✓ Saqlash</button>
      <div style="font-size:16px;font-weight:700;margin-bottom:12px">Fanlar</div>
      <button class="btn bp" style="margin-bottom:12px" onclick="addSub()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Fan qo'shish
      </button>
      <div class="card" style="padding:0;overflow:hidden">
        ${subs.length===0?`<div style="padding:20px;text-align:center;color:#9ca3af">Fanlar yo'q</div>`:
        subs.map(s=>`<div class="li"><div style="flex:1;font-weight:500">${s.name}</div><button class="btn bd bsm" onclick="delSub(${s.id})">O'chirish</button></div>`).join('')}
      </div>`;
    window.saveSettings=async()=>{try{await U('/settings',{report_channel_id:document.getElementById('set_report').value,attendance_channel_id:document.getElementById('set_att').value,applicant_channel_id:document.getElementById('set_app').value});toast('✅ Saqlandi');}catch(e){toast('❌ '+e.message);}};
    window.addSub=()=>openModal("Fan qo'shish",`<div class="ig"><label class="il">Fan nomi</label><input id="sn" class="inp" placeholder="Matematika"/></div><button class="btn bp" onclick="saveSb()">✓ Saqlash</button>`);
    window.saveSb=async()=>{const n=document.getElementById('sn').value.trim();if(!n)return toast('Fan nomi kerak');try{await P('/subjects',{name:n});closeModal();toast('✅ Saqlandi');load();}catch(e){toast('❌ '+e.message);}};
    window.delSub=async id=>{if(!confirm("O'chirishni tasdiqlaysizmi?"))return;try{await D(`/subjects/${id}`);toast("O'chirildi");load();}catch(e){toast('❌ '+e.message);}};
  }
  load();
}

// ============ DEBTORS ============
async function rDebtors(el){
  const months=sixMonths();let sm=nowMonth();let ma='';
  function draw(){
    const maFmt=ma?('<div style="font-size:12px;color:#07568A;margin-top:4px">'+fmt(ma)+'dan kam</div>'):'';
    el.innerHTML='<div class="st">OY TANLANG</div>'
      +'<div class="mp">'+months.map(m=>'<div class="mpb'+(m===sm?' on':'')+'" onclick="dm(\'' +m+ '\'">'+mLabel(m)+'</div>').join('')+'</div>'
      +'<div class="ig"><label class="il">Maksimal summa (bo\u02bcsh = 0 to\u02bclaganlar)</label>'
      +'<input id="dma" type="number" class="inp" placeholder="200000" value="'+ma+'" oninput="dmi(this.value)"/>'
      +maFmt+'</div>'
      +'<button class="btn bp" style="margin-bottom:16px" onclick="dSearch()">Ko\u02bcrish</button>'
      +'<div id="dr"></div>';

    window.dm=m=>{sm=m;draw();};
    window.dmi=v=>{ma=v;};

    window.dSearch=async()=>{
      const res=document.getElementById('dr');
      res.innerHTML=ldHtml();
      try{
        const url='/debtors?monthYear='+sm+(ma?('&maxAmount='+ma):'');
        const data=await G(url);
        if(!data.length){
          res.innerHTML='<div style="text-align:center;padding:32px;color:#15803d"><div style="font-size:48px;margin-bottom:12px">\u2705</div>Qarzdorlar yo\u02bclq!</div>';
          return;
        }
        window._dd=data;window._dsm=sm;window._dma=ma;
        let html='';
        data.forEach(g=>{
          const students=g.students.map(s=>{
            const remain=s.remainingAmount?('<div style="font-size:11px;color:#9ca3af">Qoldi: '+fmt(s.remainingAmount)+'</div>'):'';
            return '<div class="li" style="cursor:default">'
              +'<div style="flex:1">'
              +'<div style="font-size:15px;font-weight:500">'+s.firstName+' '+s.lastName+'</div>'
              +'<div style="font-size:12px;color:#9ca3af">'+(s.phoneSelf||s.phoneFather||'\u2014')+'</div>'
              +'</div>'
              +'<div style="text-align:right">'
              +'<div style="color:#ef4444;font-weight:700;font-size:14px">'+fmt(s.paidAmount)+'</div>'
              +remain
              +'</div></div>';
          }).join('');
          html+='<div style="margin-bottom:16px">'
            +'<div class="st">'+g.subjectName+'</div>'
            +'<div class="card" style="padding:0;overflow:hidden">'+students+'</div>'
            +'<button class="btn bs" style="margin-top:8px;font-size:13px" onclick="dNotify('+g.groupId+')">'
            +'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>'
            +' Xabar yuborish</button></div>';
        });
        res.innerHTML=html;
      }catch(e){res.innerHTML=emHtml('Xatolik: '+e.message);}
    };

    window.dNotify=async groupId=>{
      const data=window._dd||[];
      const sm2=window._dsm||sm;
      const ma2=window._dma||ma;
      const group=data.find(g=>g.groupId==groupId);
      if(!group||!group.students.length)return toast("Qarzdorlar yo'q");
      const monthLbl=mLabel(sm2);
      const lines=group.students.map(s=>{
        const ph=s.phoneSelf||s.phoneFather||'';
        return s.firstName+' '+s.lastName+' \u2014 '+fmt(s.paidAmount)+(ph?' ('+ph+')':'');
      });
      const previewArr=[
        "\u26a0 Qarzdorlar ro'yxati",
        "\uD83D\uDCDA Fan: "+group.subjectName,
        "\uD83D\uDCC5 Oy: "+monthLbl,
        "\u2015\u2015\u2015\u2015\u2015\u2015"
      ].concat(lines).concat(["","Jami: "+group.students.length+" ta o'quvchi"]);
      const preview=previewArr.join('\n');
      openModal('Xabar yuborish',
        '<div style="font-size:13px;color:#6b7280;margin-bottom:12px">Kanalga yuboriladigan xabar:</div>'
        +'<div style="background:#f3f4f6;border-radius:12px;padding:14px;font-size:13px;white-space:pre-line;margin-bottom:16px;line-height:1.6;max-height:280px;overflow-y:auto">'+preview+'</div>'
        +'<button class="btn bp" id="dnBtn" onclick="dSend('+groupId+',\''+sm2+'\','+parseInt(ma2||0)+')">Xabarni yuborish</button>'
      );
    };

    window.dSend=async(gid,month,maxAmt)=>{
      const btn=document.getElementById('dnBtn');
      if(btn){btn.disabled=true;btn.textContent='Yuborilmoqda...';}
      try{
        await P('/debtors/notify',{groupId:parseInt(gid),monthYear:month,maxAmount:maxAmt||null});
        closeModal();toast('\u2705 Xabar yuborildi');
      }catch(e){
        toast('\u274c '+e.message);
        if(btn){btn.disabled=false;btn.textContent='Xabarni yuborish';}
      }
    };
  }
  draw();
}

// ============ DELETE STAFF ============
async function rDelStaff(el){
  async function load(){
    const staff=await G('/staff');
    el.innerHTML=`<div class="st" style="margin-bottom:12px">HODIMLARNI O'CHIRISH</div>
      ${staff.length===0?emHtml("Hodimlar yo'q"):`<div class="card" style="padding:0;overflow:hidden">${staff.map(s=>`<div class="li">
        <div class="lic" style="background:#fee2e2"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
        <div style="flex:1"><div style="font-size:15px;font-weight:500">${s.firstName} ${s.lastName}</div>
        <div style="font-size:12px;color:#9ca3af">${s.role==='teacher'?"O'qituvchi":'Qabulxona'}${s.subject?' · '+s.subject:''}</div></div>
        <button class="btn bd bsm" onclick="dsConf(${s.id},'${s.firstName} ${s.lastName}')">O'chirish</button>
      </div>`).join('')}</div>`}`;
    window.dsConf=(id,name)=>{
      openModal("O'chirishni tasdiqlang",`<div style="font-size:15px;color:#6b7280;margin-bottom:20px"><b>${name}</b> ni o'chirishni tasdiqlaysizmi?</div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <button class="btn bd" onclick="doDs(${id})">O'chirish</button>
          <button class="btn bs" onclick="closeModal()">Bekor qilish</button>
        </div>`);
      window.doDs=async id2=>{try{await D(`/staff/${id2}?action=delete`);closeModal();toast("O'chirildi");load();}catch(e){toast('❌ '+e.message);}};
    };
  }
  load();
}

init();
</script>
